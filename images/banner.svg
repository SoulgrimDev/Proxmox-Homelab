<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Proxmox Homelab Documentation</title>
  <desc id="d">Banner for a homelab documentation repository</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="12" height="300" fill="#e57000"/>

  <!-- Server rack icon -->
  <g transform="translate(90,75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#334155" stroke="#e57000" stroke-width="2"/>
    <circle cx="20" cy="20" r="5" fill="#22c55e"/>
    <rect x="45" y="16" width="95" height="8" rx="4" fill="#475569"/>

    <rect x="0" y="55" width="160" height="40" rx="6" fill="#334155" stroke="#e57000" stroke-width="2"/>
    <circle cx="20" cy="75" r="5" fill="#22c55e"/>
    <rect x="45" y="71" width="95" height="8" rx="4" fill="#475569"/>

    <rect x="0" y="110" width="160" height="40" rx="6" fill="#334155" stroke="#e57000" stroke-width="2"/>
    <circle cx="20" cy="130" r="5" fill="#22c55e"/>
    <rect x="45" y="126" width="95" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- Text -->
  <text x="310" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Proxmox Homelab</text>
  <text x="313" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">Documentation · Incidents · Changes · Knowledge Base</text>
</svg>
